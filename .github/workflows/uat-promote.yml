name: Promote accepted UAT

on:
  workflow_dispatch:
    inputs:
      tag:
        description: UAT tag (vX.Y.Z-uat.N)
        required: true
        type: string
      acceptance_issue:
        description: Closed acceptance Issue number
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: uat-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Require latest pending candidate and acceptance evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ISSUE: ${{ inputs.acceptance_issue }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" == "private" ]] || {
            echo "UAT Pre-releases require a private GitHub repository" >&2
            exit 1
          }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-uat\.[0-9]+$ ]]
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          commit="$(git rev-parse "$TAG^{commit}")"
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq \
            '[.[] | select(.draft == true and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-uat\\.[0-9]+$")))] | sort_by(.created_at) | last | .tag_name // ""')"
          [[ "$latest" == "$TAG" ]] || {
            echo "Only the latest pending candidate may be promoted (latest: $latest)" >&2
            exit 1
          }
          bash joysong-server/deploy/ci/verify-uat-acceptance.sh "$TAG" "$commit" "$ISSUE"
      - name: Publish as GitHub Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ISSUE: ${{ inputs.acceptance_issue }}
        run: |
          gh release edit "$TAG" --draft=false --prerelease=true --latest=false
          gh issue comment "$ISSUE" --body "UAT candidate \`$TAG\` promoted to GitHub Pre-release by workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
