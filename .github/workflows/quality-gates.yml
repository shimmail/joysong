name: Quality gates

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      admin: ${{ steps.scope.outputs.admin }}
      flutter: ${{ steps.scope.outputs.flutter }}
      infrastructure: ${{ steps.scope.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: scope
        name: Detect changed components
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            changed="$(git ls-files)"
          else
            base="$PR_BASE_SHA"
            [[ -n "$base" ]] || base="$PUSH_BASE_SHA"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse HEAD^)"
            fi
            changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
          fi
          match() { grep -Eq "$1" <<<"$changed" && printf true || printf false; }
          {
            echo "backend=$(match '^joysong-server/(src/|build\.gradle\.kts$|settings\.gradle\.kts$|gradle/|gradlew(\.bat)?$|gradle\.properties$)')"
            echo "admin=$(match '^joysong-admin/')"
            echo "flutter=$(match '^joysong-flutter/|^\.github/workflows/quality-gates\.yml$')"
            echo "infrastructure=$(match '^(\.github/|joysong-server/deploy/|docs/guide/deployment/|design/ALIYUN_CICD_DEPLOYMENT\.puml$)')"
          } >>"$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: worktree_ci_${{ github.run_id }}_${{ github.run_attempt }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: worktree_ci_${{ github.run_id }}_${{ github.run_attempt }}/joysong-server/gradle/wrapper/gradle-wrapper.properties
      - name: Test and package backend
        working-directory: worktree_ci_${{ github.run_id }}_${{ github.run_attempt }}/joysong-server
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x gradlew
          ./gradlew test bootJar --no-daemon

  backend-mysql:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: agent-demo
            filters: '--tests com.joysong.server.agent.* --tests com.joysong.server.demo.*'
          - name: professional
            filters: '--tests com.joysong.server.doctor.* --tests com.joysong.server.identity.* --tests com.joysong.server.institution.*'
          - name: platform
            filters: '--tests com.joysong.server.legal.* --tests com.joysong.server.migration.* --tests com.joysong.server.notification.* --tests com.joysong.server.payment.* --tests com.joysong.server.project.* --tests com.joysong.server.reconciliation.* --tests com.joysong.server.user.*'
    name: Backend MySQL (${{ matrix.shard.name }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: worktree_ci_${{ github.run_id }}_${{ github.run_attempt }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: worktree_ci_${{ github.run_id }}_${{ github.run_attempt }}/joysong-server/gradle/wrapper/gradle-wrapper.properties
      - name: Test backend on isolated MySQL
        working-directory: worktree_ci_${{ github.run_id }}_${{ github.run_attempt }}/joysong-server
        shell: bash
        env:
          TEST_FILTERS: ${{ matrix.shard.filters }}
        run: |
          set -Eeuo pipefail
          repository_root="$(git rev-parse --show-toplevel)"
          worktree_id="$(basename "$repository_root")"
          [[ "$worktree_id" == worktree_* ]]
          database_name="myapp_${worktree_id}"
          echo "Migration/test database host: Testcontainers isolated MySQL"
          echo "Migration/test database name: $database_name"
          read -r -a test_filters <<<"$TEST_FILTERS"
          chmod +x gradlew
          ./gradlew mysqlIntegrationTest "${test_filters[@]}" --no-daemon

  admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: joysong-admin/package-lock.json
      - name: Lint, typecheck, test and build admin
        working-directory: joysong-admin
        run: |
          npm ci
          npm run lint
          npm test -- --maxWorkers=1 --fileParallelism=false
          npm run build

  flutter:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: joysong-flutter/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          flutter-version: '3.44.8'
          cache: true
      - name: Analyze, test and build Flutter Android debug
        working-directory: joysong-flutter
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --debug --flavor development --dart-define=APP_ENV=development
          test -f build/app/outputs/flutter-apk/app-development-debug.apk

  infrastructure:
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Parse workflow YAML
        shell: bash
        run: |
          ruby -e 'require "yaml"; (Dir[".github/workflows/*.{yml,yaml}"] + Dir[".github/ISSUE_TEMPLATE/*.{yml,yaml}"]).sort.each { |path| abort("invalid YAML: #{path}") unless YAML.parse(File.read(path)) }'
      - name: Validate deployment contracts and Python syntax
        run: python3 joysong-server/deploy/ci/validate-workflows.py
      - name: Run deployment unit tests
        run: python3 -m unittest discover -s joysong-server/deploy/tests -p 'test_*.py'
      - name: Validate and lint deployment shell
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -d '' shell_files < <(find joysong-server/deploy -type f -name '*.sh' -print0)
          for extensionless in \
            joysong-server/deploy/host/joysong-release-dispatch \
            joysong-server/deploy/host/joysong-uat-deploy; do
            [[ ! -f "$extensionless" ]] || shell_files+=("$extensionless")
          done
          for shell_file in "${shell_files[@]}"; do
            bash -n "$shell_file"
          done
          command -v shellcheck >/dev/null
          shellcheck -x "${shell_files[@]}"
      - name: Run pinned actionlint
        run: bash joysong-server/deploy/ci/run-actionlint.sh

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Block high and critical vulnerabilities, secrets and misconfiguration
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: json
          output: quality-scan-report.json
          version: v0.74.0
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: quality-sbom.cdx.json
          exit-code: '0'
          version: v0.74.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-security-${{ github.sha }}
          path: |
            quality-scan-report.json
            quality-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce empty high-severity security report
        shell: bash
        run: |
          set -Eeuo pipefail
          findings="$(jq '[.Results[]? | ((.Vulnerabilities // [])[]?, (.Misconfigurations // [])[]?, (.Secrets // [])[]?)] | length' quality-scan-report.json)"
          [[ "$findings" =~ ^[0-9]+$ ]]
          if ((findings > 0)); then
            jq -r '.Results[]? as $result | ((.Vulnerabilities // [])[]?, (.Misconfigurations // [])[]?, (.Secrets // [])[]?) | [$result.Target, (.VulnerabilityID // .ID // .RuleID // "unknown"), (.Severity // "UNKNOWN")] | @tsv' quality-scan-report.json
            echo "Security gate found $findings high/critical vulnerability, secret or misconfiguration result(s)." >&2
            exit 1
          fi

  quality-gates:
    name: Required quality gates
    if: always()
    needs: [changes, backend, backend-mysql, admin, flutter, infrastructure, security]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e '
            .changes.result == "success" and
            .security.result == "success" and
            (
              (.changes.outputs.backend == "true" and
               .backend.result == "success" and
               ."backend-mysql".result == "success") or
              (.changes.outputs.backend != "true" and
               .backend.result == "skipped" and
               ."backend-mysql".result == "skipped")
            ) and
            (
              (.changes.outputs.admin == "true" and .admin.result == "success") or
              (.changes.outputs.admin != "true" and .admin.result == "skipped")
            ) and
            (
              (.changes.outputs.flutter == "true" and .flutter.result == "success") or
              (.changes.outputs.flutter != "true" and .flutter.result == "skipped")
            ) and
            (
              (.changes.outputs.infrastructure == "true" and .infrastructure.result == "success") or
              (.changes.outputs.infrastructure != "true" and .infrastructure.result == "skipped")
            )
          ' <<<"$RESULTS" >/dev/null
          echo "All selected quality gates passed."
