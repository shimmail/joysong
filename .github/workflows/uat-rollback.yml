name: Roll back deployed release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        required: true
        type: choice
        options: [uat, prod]
      target_tag:
        description: Existing verified server release tag
        required: true
        type: string
      reason:
        description: Rollback reason recorded in the run summary
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ inputs.environment }}-deployment
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || 'uat' }}
    env:
      ALIYUN_REGION: ${{ vars.ALIYUN_REGION }}
      ALIYUN_ECS_INSTANCE_ID: ${{ vars.ALIYUN_ECS_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate rollback input
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TARGET_TAG: ${{ inputs.target_tag }}
          REASON: ${{ inputs.reason }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$ENVIRONMENT" == "uat" ]]; then
            [[ "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-uat\.[0-9]+$ ]]
          else
            [[ "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fi
          [[ -n "$REASON" ]]
          {
            echo "## Rollback request"
            echo "- Environment: $ENVIRONMENT"
            echo "- Target: $TARGET_TAG"
            echo "- Reason: $REASON"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Acquire short-lived Alibaba Cloud credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1
        with:
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALIYUN_OIDC_ROLE_ARN }}
          role-session-name: joysong-rollback-${{ github.run_id }}
          role-session-expiration: 1800
          audience: github-actions
      - name: Install pinned Alibaba Cloud CLI
        run: bash joysong-server/deploy/ci/install-aliyun-cli.sh
      - name: Atomically switch to verified server release
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: bash joysong-server/deploy/ci/cloud-assistant.sh rollback "$ENVIRONMENT" "$TARGET_TAG"
