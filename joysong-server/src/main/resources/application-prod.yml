spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # Production must point at a pre-created database. Do not append
    # createDatabaseIfNotExist=true to DB_URL.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  devtools:
    restart:
      enabled: false

oss:
  enabled: true
  endpoint: ${OSS_ENDPOINT}
  region: ${OSS_REGION}
  bucket-name: ${OSS_BUCKET_NAME}
  public-base-url: ${OSS_PUBLIC_BASE_URL:}
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}

aliyun:
  sms:
    enabled: true
    access-key-id: ${SMS_ACCESS_KEY_ID}
    access-key-secret: ${SMS_ACCESS_KEY_SECRET}
    sign-name: ${SMS_SIGN_NAME}
    template-code: ${SMS_TEMPLATE_CODE}

security:
  verification-code:
    log-for-dev: false

app:
  # Production share links must use a trusted, explicitly configured public origin.
  share-base-url: ${APP_SHARE_BASE_URL}
  share-request-origin-fallback-enabled: false
  # Production is hard-disabled in code as well. These explicit values document
  # the release gate and cannot be used to opt in.
  account-deletion:
    enabled: false
    allow-commerce-bypass: false

payment:
  alipay-plus:
    # Never auto-complete newly created orders in production.
    auto-pay-on-order-create-enabled: false
    # Never allow simulated money movement in production.
    simulated-enabled: false
