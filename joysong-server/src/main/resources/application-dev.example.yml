# Copy this file to application-dev.yml for local development. The copied file
# remains ignored so machine-specific values and secrets cannot be committed.
spring:
  datasource:
    password: ${DB_PASSWORD:}
  jpa:
    show-sql: true

oss:
  enabled: false

aliyun:
  sms:
    enabled: false

security:
  verification-code:
    log-for-dev: true

payment:
  development:
    # Auto-completes newly created booking orders through the real local payment state machine.
    order-auto-pay-enabled: true
  alipay-plus:
    # Lets the full payment/refund journey run locally without a merchant account.
    simulated-enabled: true
