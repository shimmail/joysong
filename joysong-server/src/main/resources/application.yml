spring:
  application:
    name: joysong-server
  datasource:
    url: jdbc:mysql://localhost:3306/joysong?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
    baseline-on-migrate: true
    baseline-version: 1
  # DevTools 热重启配置
  devtools:
    restart:
      enabled: true
      include: ""
      exclude: com/joysong/**
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  base-url: ${SERVER_BASE_URL:http://localhost:8080}

# 上传根目录。生产环境设为如 /var/lib/joysong/uploads，并与 Nginx 的 /images/ alias 保持一致。
upload:
  local-dir: ${UPLOAD_LOCAL_DIR:./data/uploads}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  admin-expiration: 28800000
  refresh-expiration: 2592000000

admin:
  bootstrap:
    phone: ${ADMIN_PHONE:}
    password: ${ADMIN_PASSWORD:}

seed:
  demo:
    enabled: ${SEED_DEMO_ENABLED:false}
    password: ${DEMO_USER_PASSWORD:}

security:
  admin-login:
    max-failures: 5
    window-seconds: 900
    lock-duration-seconds: 900
  verification-code:
    # Only application-dev.yml opts into logging a usable local code.
    log-for-dev: false

google:
  client-id: ${GOOGLE_CLIENT_ID}
  # 仅用于 Google ID Token 校验访问 Google 公钥；留空时直连，不影响其他 HTTP 请求。
  # 示例：http://127.0.0.1:7890 或 http://proxy.example.internal:8080
  proxy-url: ${GOOGLE_PROXY_URL:}

oss:
  enabled: ${OSS_ENABLED:false}
  endpoint: ${OSS_ENDPOINT:}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  bucket-name: ${OSS_BUCKET_NAME:}
  public-base-url: ${OSS_PUBLIC_BASE_URL:}

ai-agent:
  enabled: ${AI_AGENT_ENABLED:false}
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:}
  model: ${AI_AGENT_MODEL:}
  # Supported proxy schemes are http:// and socks://. HTTPS proxy endpoints are rejected.
  proxy-url: ${OPENAI_PROXY_URL:}
  turn-lease: ${AI_AGENT_TURN_LEASE_SECONDS:90}s
  # Only ambiguous or complex requests use the extra lightweight JSON classification call.
  intent-parser-enabled: ${OPENAI_INTENT_PARSER_ENABLED:true}
  # Demo output is opt-in only in development.
  demo-fallback-enabled: ${OPENAI_DEMO_FALLBACK_ENABLED:false}

# OpenAI-compatible settings retained for the independently routed translation fallback.
openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:}
  stream-enabled: ${OPENAI_STREAM_ENABLED:false}
  # 普通聊天和详情总结优先快速首包；规划、对比、安全判断保留少量推理预算。
  # 兼容第三方 OpenAI 网关：留空时不发送 reasoning_effort；确认网关支持后可设 none/low。
  fast-reasoning-effort: ${OPENAI_FAST_REASONING_EFFORT:none}
  complex-reasoning-effort: ${OPENAI_COMPLEX_REASONING_EFFORT:}
  # Retained for existing development profile compatibility; ChatService uses ai-agent.
  demo-fallback-enabled: false

# 翻译与 AI Agent 独立选型。默认使用百炼 qwen3.7-flash；OpenAI 作为可选兜底。
translation:
  provider: ${TRANSLATION_PROVIDER:qwen}
  fallback-provider: ${TRANSLATION_FALLBACK_PROVIDER:openai}
  model: ${TRANSLATION_MODEL:gpt-5.5}
  qwen:
    api-key: ${QWEN_API_KEY:}
    base-url: ${QWEN_BASE_URL:${QWEN_MT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
    model: ${QWEN_MODEL:qwen3.7-flash}
# 阿里云短信服务配置
# 使用前需要：
# 1. 在阿里云控制台开通短信服务: https://dysms.console.aliyun.com
# 2. 申请短信签名（如“娇颜颂”）
# 3. 申请短信模板（验证码模板，如：您的验证码为${code}，请勿泄露给他人）
# 4. 将 enabled 设为 true 并填写签名和模板编码
aliyun:
  sms:
    enabled: ${SMS_ENABLED:false}
    access-key-id: ${SMS_ACCESS_KEY_ID:}
    access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
    sign-name: ${SMS_SIGN_NAME:}
    template-code: ${SMS_TEMPLATE_CODE:}

payment:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    # Hosted Checkout returns to these public HTTPS pages. They may be Universal/App Links.
    success-url: ${STRIPE_SUCCESS_URL:https://example.com/payment/success?session_id={CHECKOUT_SESSION_ID}}
    cancel-url: ${STRIPE_CANCEL_URL:https://example.com/payment/cancel}
    api-base: ${STRIPE_API_BASE:https://api.stripe.com}
    api-version: ${STRIPE_API_VERSION:}
    webhook-tolerance-seconds: ${STRIPE_WEBHOOK_TOLERANCE_SECONDS:300}
    product-name: ${STRIPE_PRODUCT_NAME:Joysong medical service}
  reconciliation:
    enabled: ${PAYMENT_RECONCILIATION_ENABLED:true}
    fixed-delay-ms: ${PAYMENT_RECONCILIATION_DELAY_MS:60000}
    stale-after-seconds: ${PAYMENT_RECONCILIATION_STALE_SECONDS:120}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080}

# 订单分账比例配置（百分比）
order:
  split:
    platform-rate: 40.00    # 平台服务费比例
    institution-rate: 40.00  # 机构默认分成比例
