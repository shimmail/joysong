spring:
  application:
    name: joysong-server
  datasource:
    url: jdbc:mysql://localhost:3306/joysong?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
    baseline-on-migrate: true
    baseline-version: 1
  # DevTools 热重启配置
  devtools:
    restart:
      enabled: true
      include: ""
      exclude: com/joysong/**
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  base-url: ${SERVER_BASE_URL:http://localhost:8080}

# 上传根目录。生产环境设为如 /var/lib/joysong/uploads，并与 Nginx 的 /images/ alias 保持一致。
upload:
  local-dir: ${UPLOAD_LOCAL_DIR:./data/uploads}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  admin-expiration: 28800000
  refresh-expiration: 2592000000

admin:
  bootstrap:
    phone: ${ADMIN_PHONE:}
    password: ${ADMIN_PASSWORD:}

security:
  admin-login:
    max-failures: 5
    window-seconds: 900
    lock-duration-seconds: 900
  verification-code:
    # Only application-dev.yml opts into logging a usable local code.
    log-for-dev: false

google:
  client-id: ${GOOGLE_CLIENT_ID}
  # 仅用于 Google ID Token 校验访问 Google 公钥；留空时直连，不影响其他 HTTP 请求。
  # 示例：http://127.0.0.1:7890 或 http://proxy.example.internal:8080
  proxy-url: ${GOOGLE_PROXY_URL:}

oss:
  enabled: ${OSS_ENABLED:false}
  endpoint: ${OSS_ENDPOINT:}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  bucket-name: ${OSS_BUCKET_NAME:}
  public-base-url: ${OSS_PUBLIC_BASE_URL:}

ai-agent:
  provider: ${AI_AGENT_PROVIDER:}
  api-key: ${AI_AGENT_API_KEY:}
  base-url: ${AI_AGENT_BASE_URL:}
  model: ${AI_AGENT_MODEL:}
  intent-model: ${AI_AGENT_INTENT_MODEL:}

# 翻译 Agent 独立配置，不回退或复用 AI Agent、OPENAI_*、QWEN_* 凭证。
translation:
  provider: ${TRANSLATION_PROVIDER:qwen}
  api-key: ${TRANSLATION_API_KEY:}
  base-url: ${TRANSLATION_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  model: ${TRANSLATION_MODEL:qwen3.7-flash}

# 阿里云短信服务配置
# 使用前需要：
# 1. 在阿里云控制台开通短信服务: https://dysms.console.aliyun.com
# 2. 申请短信签名（如“娇颜颂”）
# 3. 申请短信模板（验证码模板，如：您的验证码为${code}，请勿泄露给他人）
# 4. 将 enabled 设为 true 并填写签名和模板编码
aliyun:
  sms:
    enabled: ${SMS_ENABLED:false}
    access-key-id: ${SMS_ACCESS_KEY_ID:}
    access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
    sign-name: ${SMS_SIGN_NAME:}
    template-code: ${SMS_TEMPLATE_CODE:}

payment:
  alipay-plus:
    # Requires the dev profile and simulated gateway as independent safety gates.
    auto-pay-on-order-create-enabled: ${ALIPAY_PLUS_AUTO_PAY_ON_ORDER_CREATE_ENABLED:false}
    # Development-only simulated gateway. The prod profile overrides this to false.
    simulated-enabled: ${ALIPAY_PLUS_SIMULATED_ENABLED:false}
  stripe:
    # Legacy-only adapter for historical Stripe query/refund liabilities. New payments never use it.
    legacy-enabled: ${STRIPE_LEGACY_ENABLED:false}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    # Legacy Hosted Checkout returns to these public HTTPS pages. They may be Universal/App Links.
    success-url: ${STRIPE_SUCCESS_URL:}
    cancel-url: ${STRIPE_CANCEL_URL:}
    api-base: ${STRIPE_API_BASE:https://api.stripe.com}
    api-version: ${STRIPE_API_VERSION:}
    webhook-tolerance-seconds: ${STRIPE_WEBHOOK_TOLERANCE_SECONDS:300}
    product-name: ${STRIPE_PRODUCT_NAME:Joysong legacy medical service}
  reconciliation:
    enabled: ${PAYMENT_RECONCILIATION_ENABLED:true}
    fixed-delay-ms: ${PAYMENT_RECONCILIATION_DELAY_MS:60000}
    stale-after-seconds: ${PAYMENT_RECONCILIATION_STALE_SECONDS:120}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080}

# 订单分账比例配置（百分比）
order:
  split:
    platform-rate: 40.00    # 平台服务费比例
    institution-rate: 40.00  # 机构默认分成比例
  pricing:
    travel-ground-service:
      service-fee-rate: 40.00  # 出行地接服务费比例

app:
  account-deletion:
    enabled: ${ACCOUNT_DELETION_ENABLED:false}
    allow-commerce-bypass: ${ACCOUNT_DELETION_ALLOW_COMMERCE_BYPASS:false}
    hmac-secret: ${ACCOUNT_DELETION_HMAC_SECRET:development-only-account-deletion-secret}
  project-change:
    v1-profile-update-enabled: ${PROJECT_CHANGE_V1_PROFILE_UPDATE_ENABLED:true}
