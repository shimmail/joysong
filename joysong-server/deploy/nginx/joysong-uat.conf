# UAT currently occupies the primary domains. Before production cut-over, move
# these server blocks to uat.joyingsong.net and api-uat.joyingsong.net.

server {
    listen 80;
    server_name api.joyingsong.net;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name joyingsong.net www.joyingsong.net;
    return 301 https://joyingsong.net$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.joyingsong.net;

    ssl_certificate     /etc/nginx/tls/joyingsong.net.pem;
    ssl_certificate_key /etc/nginx/tls/joyingsong.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 52m;

    if (-f /var/lib/joysong-maintenance/uat) { return 503; }
    error_page 503 = @api_maintenance;
    location @api_maintenance {
        default_type application/json;
        return 503 '{"status":"MAINTENANCE","message":"UAT is being updated / UAT 正在更新"}';
    }

    location ^~ /images/ {
        alias /var/lib/joysong/uat/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /.well-known/joysong-release.json {
        alias /opt/joysong/uat/current/release.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location = /actuator/health {
        proxy_pass http://joysong_uat_backend;
        proxy_set_header Host $host;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location = /api/auth/login {
        limit_req zone=joysong_uat_login burst=5 nodelay;
        proxy_pass http://joysong_uat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/chat/sessions/[^/]+/messages/stream$ {
        proxy_pass http://joysong_uat_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://joysong_uat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ^~ /s/diary/ {
        proxy_pass http://joysong_uat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ^~ /legal/ {
        proxy_pass http://joysong_uat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}

server {
    listen 443 ssl http2;
    server_name www.joyingsong.net;

    ssl_certificate     /etc/nginx/tls/joyingsong.net.pem;
    ssl_certificate_key /etc/nginx/tls/joyingsong.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://joyingsong.net$request_uri;
}

server {
    listen 443 ssl http2;
    server_name joyingsong.net;

    root /opt/joysong/uat/current/admin;
    index index.html;

    ssl_certificate     /etc/nginx/tls/joyingsong.net.pem;
    ssl_certificate_key /etc/nginx/tls/joyingsong.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 52m;

    if (-f /var/lib/joysong-maintenance/uat) { return 503; }
    error_page 503 = @admin_maintenance;
    location @admin_maintenance {
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>Maintenance</title><h1>UAT is being updated</h1><p>UAT 正在更新，请稍后重试。</p>';
    }

    location ^~ /images/ {
        alias /var/lib/joysong/uat/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /.well-known/joysong-release.json {
        alias /opt/joysong/uat/current/release.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location = /api/auth/login {
        limit_req zone=joysong_uat_login burst=5 nodelay;
        proxy_pass http://joysong_uat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://joysong_uat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
