limit_req_zone $binary_remote_addr zone=joysong_uat_login:10m rate=10r/m;

upstream joysong_uat_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name joyingsong.net www.joyingsong.net api.joyingsong.net;

    root /var/www/joysong-demo/current;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 52m;

    location ^~ /images/ {
        alias /var/lib/joysong-demo/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /actuator/health {
        proxy_pass http://joysong_uat_backend;
        proxy_set_header Host $host;
    }

    location ^~ /actuator/ { return 404; }

    location = /api/auth/login {
        limit_req zone=joysong_uat_login burst=5 nodelay;
        proxy_pass http://joysong_uat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/chat/sessions/[^/]+/messages/stream$ {
        proxy_pass http://joysong_uat_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://joysong_uat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ^~ /s/diary/ {
        proxy_pass http://joysong_uat_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /legal/ {
        proxy_pass http://joysong_uat_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
