# 生产 API 与上传图片配置示例。
# 将 server_name、证书路径和 UPLOAD_LOCAL_DIR 替换为实际部署值。

upstream joysong_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name api.example.com;

    # 与 Spring 的 spring.servlet.multipart.max-request-size 保持一致；单文件仍由应用限制为 10 MiB。
    client_max_body_size 52m;

    # 直接读取与 UPLOAD_LOCAL_DIR 相同的目录，无需经由 JVM 转发。
    location ^~ /images/ {
        alias /var/lib/joysong/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        proxy_pass http://joysong_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Public diary share pages are rendered by Spring.
    location ^~ /s/diary/ {
        proxy_pass http://joysong_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # 仅在受控网络中暴露健康检查；其他 actuator 路径仍由 Spring Security 限制。
    location = /actuator/health {
        proxy_pass http://joysong_backend;
        proxy_set_header Host $host;
    }
}
