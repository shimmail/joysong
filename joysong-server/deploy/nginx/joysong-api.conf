# 生产 API 与上传图片配置。
# 公网 API 域名：api.joyingsong.net
# 运行目录与 systemd joysong@prod 保持一致。

limit_req_zone $binary_remote_addr zone=joysong_prod_login:10m rate=10r/m;

upstream joysong_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name api.joyingsong.net;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.joyingsong.net;

    ssl_certificate     /etc/nginx/tls/joyingsong.net.pem;
    ssl_certificate_key /etc/nginx/tls/joyingsong.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # 与 Spring 的 spring.servlet.multipart.max-request-size 保持一致；单文件仍由应用限制为 10 MiB。
    client_max_body_size 52m;

    if (-f /var/lib/joysong-maintenance/prod) { return 503; }
    error_page 503 = @api_maintenance;
    location @api_maintenance {
        default_type application/json;
        return 503 '{"status":"MAINTENANCE","message":"Production is being updated / 生产环境正在更新"}';
    }

    # 直接读取与 UPLOAD_LOCAL_DIR 相同的目录，无需经由 JVM 转发。
    location ^~ /images/ {
        alias /var/lib/joysong/prod/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        proxy_pass http://joysong_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location = /.well-known/joysong-release.json {
        alias /opt/joysong/prod/current/release.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location = /api/auth/login {
        limit_req zone=joysong_prod_login burst=5 nodelay;
        proxy_pass http://joysong_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/chat/sessions/[^/]+/messages/stream$ {
        proxy_pass http://joysong_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public diary share pages are rendered by Spring.
    location ^~ /s/diary/ {
        proxy_pass http://joysong_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ^~ /legal/ {
        proxy_pass http://joysong_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # 仅在受控网络中暴露健康检查；其他 actuator 路径仍由 Spring Security 限制。
    location = /actuator/health {
        proxy_pass http://joysong_backend;
        proxy_set_header Host $host;
    }

    location ^~ /actuator/ {
        return 404;
    }
}
