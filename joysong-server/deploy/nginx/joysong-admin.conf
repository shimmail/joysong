# 生产管理后台配置。
# 管理后台域名：joyingsong.net（www.joyingsong.net 同样跳转到主域名）。
# root 与 systemd joysong@prod 的原子 release 链接保持一致。

upstream joysong_admin_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name joyingsong.net www.joyingsong.net;

    return 301 https://joyingsong.net$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.joyingsong.net;

    ssl_certificate     /etc/nginx/tls/joyingsong.net.pem;
    ssl_certificate_key /etc/nginx/tls/joyingsong.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    return 301 https://joyingsong.net$request_uri;
}

server {
    listen 443 ssl http2;
    server_name joyingsong.net;

    root /opt/joysong/prod/current/admin;
    index index.html;

    ssl_certificate     /etc/nginx/tls/joyingsong.net.pem;
    ssl_certificate_key /etc/nginx/tls/joyingsong.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 52m;

    if (-f /var/lib/joysong-maintenance/prod) { return 503; }
    error_page 503 = @admin_maintenance;
    location @admin_maintenance {
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>Maintenance</title><h1>Production is being updated</h1><p>生产环境正在更新，请稍后重试。</p>';
    }

    # Keep historical local-upload URLs usable from the admin origin.
    location ^~ /images/ {
        alias /var/lib/joysong/prod/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /.well-known/joysong-release.json {
        alias /opt/joysong/prod/current/release.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    # The admin SPA uses same-origin /api requests; Nginx forwards them to Spring.
    location /api/ {
        proxy_pass http://joysong_admin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Vite history fallback keeps direct navigation to admin routes working.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
